name: xcodebuild macOS

jobs:
  xcodebuild-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version

      # xcodebuild drives the SwiftPM package directly via the synthetic
      # scheme generated from Package.swift — no .xcodeproj / .xcworkspace
      # required.
      - run: xcodebuild test -scheme Objective-LevelDB -destination 'platform=macOS' -disableAutomaticPackageResolution

"on":
  push:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 0,1,2,3,4'
